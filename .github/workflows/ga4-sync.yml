name: GA4 → Supabase 同期

on:
  schedule:
    # 毎日 UTC 17:00 = JST 02:00 に昨日分を同期
    - cron: '0 17 * * *'
  workflow_dispatch:
    inputs:
      start_date:
        description: '開始日 YYYY-MM-DD（空なら昨日）。過去全取得は 2020-01-01'
        required: false
        default: ''
      end_date:
        description: '終了日 YYYY-MM-DD または yesterday（空なら昨日）'
        required: false
        default: ''

# 最小権限: このワークフローはリポジトリを読むだけ（書き込み権限は渡さない）
permissions:
  contents: read

# 同時実行を防ぐ（手動バックフィルと日次が重ならないように）
concurrency:
  group: ga4-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: scripts/ga4-sync
        run: npm ci --no-audit --no-fund

      - name: Run GA4 sync
        working-directory: scripts/ga4-sync
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_SA_KEY: ${{ secrets.GA4_SA_KEY }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://clyfrkwuajbauqxvrfyf.supabase.co' }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          START_DATE: ${{ github.event.inputs.start_date }}
          END_DATE: ${{ github.event.inputs.end_date }}
        run: node sync.mjs
